---
name: Sync Fork

on:
  workflow_call:
    inputs:
      SOURCE_REPO:
        description: "Source repository. (e.g. upptime/upptime)"
        required: false
        type: string
      DESTINATION_REPO:
        description: "Destination repository. (e.g. dennykorsukewitz/upptime)"
        required: false
        type: string
      BRANCH:
        description: "Branch name. (e.g. main)"
        required: false
        type: string
    secrets:
      PAT:
        required: true

  workflow_dispatch:
    inputs:
      SOURCE_REPO:
        description: "Source repository. (e.g. upptime/upptime)"
        required: false
        type: string
      DESTINATION_REPO:
        description: "Destination repository. (e.g. dennykorsukewitz/upptime)"
        required: false
        type: string
      BRANCH:
        description: "Branch name. (e.g. main)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  Sync:
    runs-on: ubuntu-latest
    steps:
      # - name: github-sync
      #   uses: repo-sync/github-sync@v2
      #   with:
      #     source_repo: "upptime/upptime"
      #     source_branch: "master"
      #     destination_repo: "dennykorsukewitz/upptime"
      #     destination_branch: "master"
      #     github_token: ${{ secrets.PAT }}

      - name: Checkout code
        uses: actions/checkout@v6
      - name: Sync fork
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          SOURCE_REPO: ${{ inputs.SOURCE_REPO }}
          DESTINATION_REPO: ${{ inputs.DESTINATION_REPO }}
          BRANCH: ${{ inputs.BRANCH || 'main' }}
        run: |
          gh repo sync "$DESTINATION_REPO" --source "$SOURCE_REPO" --branch "$BRANCH" --force