---
name: Release

on:
  workflow_call:
    inputs:
      VSC_NAME:
        description: "The name of the vscode extension. (package.json -> name)"
        required: false
        type: string
    secrets:
      VSC_PAT:
        required: true
      PAT:
        required: true

  workflow_dispatch:
    inputs:
      VSC_NAME:
        description: "The name of the vscode extension. (package.json -> name)"
        required: false
        type: string

jobs:
  Release-GitHub:
    name: Release GitHub
    environment:
      name: Release
      url: "https://github.com/dennykorsukewitz/${{ github.event.repository.name }}/releases/tag/${{ github.ref }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        env:
          fetch-depth: "1"
        with:
          ref: ${{ github.ref }}

      - name: Install the dependencies
        run: npm i

      - name: Install vsce
        run: npm i -g vsce

      - name: Build vsix Package
        run: vsce package

      - name: Change RELEASE.md
        run: sed -i '1,2d' RELEASE.md

      - uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.PAT }}
          artifacts: "${{ github.event.repository.name }}*.vsix"
          bodyFile: "RELEASE.md"
          draft: true
          generateReleaseNotes: true

  Release-VSCode:
    name: Release VSCode
    environment:
      name: Release VSCode
      url: "https://marketplace.visualstudio.com/items?itemName=dennykorsukewitz.${{ inputs.VSC_NAME }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install the dependencies
        run: npm i

      - name: Install vsce
        run: npm i -g vsce

      - name: Publish
        run: vsce publish -p ${{ inputs.VSC_PAT }}
